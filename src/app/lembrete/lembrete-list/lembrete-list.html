<div class="container-fluid">
    <div class="row">
        <div class="col-2 col-lg-3 col-xl-2 px-0">
            <app-side-menu style="position: sticky; top: 0; display: block; height: 100vh;"></app-side-menu>
        </div>
        <div class="col-10 d-flex flex-column p-3" style="background-color: #111722; color: white;">

            <h1>Lembretes</h1>

            <button class="btn-nova" (click)="novoLembrete()">
                + Novo Lembrete
            </button>

            <div class="lista-lembretes">

                <div class="card" *ngFor="let lembrete of lembretes">

                    <div class="info">

                        <span class="lembrete-nome">
                            {{ lembrete.descricao }}
                        </span>

                        <span class="lembrete-info">
                            📅 {{ lembrete.data_hora | date: 'dd/MM/yyyy'}} •
                            {{ lembrete.recorrente ? '🔁 Recorrente' : '📌 Único' }}
                        </span>

                    </div>

                    <div class="acoes">

                        <button (click)="editarLembrete(lembrete.id)">
                            Editar
                        </button>

                        <button (click)="excluirLembrete(lembrete.id)">
                            Excluir
                        </button>

                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
