<div class="container-fluid">
    <div class="row">
        <div class="col-12 col-lg-3 col-xl-2 px-0">
            <app-side-menu></app-side-menu>
        </div>
        <div style="background-color: #0e141b; color: white;" class="col-10 d-flex flex-column p-3">
            <h1>Novo Lembrete</h1>

            <div class="form-container">

                <div class="campo">

                    <label>Descrição</label>

                    <input
                        type="text"
                        [(ngModel)]="novoLembrete.descricao"
                        placeholder="Digite a descrição do lembrete">

                </div>

                <div class="campo">

                    <label>Tipo</label>

                    <div class="tipo-container">

                        <label class="radio-option">

                            <input
                                (click)="naoRecorrente()"
                                type="radio"
                                name="tipo"
                                [value]="false"
                                [(ngModel)]="novoLembrete.recorrente">

                            Único

                        </label>

                        <label class="radio-option">

                            <input
                                type="radio"
                                name="tipo"
                                [value]="true"
                                [(ngModel)]="novoLembrete.recorrente">

                            Recorrente

                        </label>

                    </div>

                </div>
                @if (novoLembrete.recorrente) {
                    <div class="campo">
                        <label>Frequencia</label>
                        <div class="tipo-container">
                            <label class="radio-option">
                                <input type="radio" name="frequencia" value="DIARIA" [(ngModel)]="novoLembrete.frequencia">
                                Diária
                            </label>

                            <label class="tipo-container">
                                <input type="radio" name="frequencia" value="SEMANAL" [(ngModel)]="novoLembrete.frequencia">
                                Semanal
                            </label>

                            <label class="tipo-container">
                                <input type="radio" name="frequencia" value="MENSAL" [(ngModel)]="novoLembrete.frequencia">
                                Mensal
                            </label>

                            <label class="tipo-container">
                                <input type="radio" name="frequencia" value="ANUAL" [(ngModel)]="novoLembrete.frequencia">
                                Anual
                            </label>
                        </div>
                    </div>
                }

                <div class="campo">

                    <label>Data Fim</label>

                    <input
                        type="date"
                        [(ngModel)]="data">

                </div>

                <div class="campo">
                    <label>Horario</label>
                    <input type="time"[(ngModel)]="hora">
                </div>

                <div class="campo">
                    <label>Categoria</label>
                    <select [(ngModel)]="novoLembrete.categoria_id" name="categoria">
                        @for (categoria of categorias; track $index) {
                            <option value="{{categoria.id}}">{{categoria.nome}}</option>
                        }
                    </select>
                </div>

                <div class="botoes">

                <button class="btn-salvar" (click)="salvarLembrete()">
                    Salvar
                </button>

                <button class="btn-cancelar" (click)="cancelar()">
                    Cancelar
                </button>

                </div>

            </div>
        </div>
    </div>
</div>
