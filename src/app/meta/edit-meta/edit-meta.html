<div class="container-fluid">
    <div class="row">
        <div class="col-12 col-lg-3 col-xl-2 px-0">
            <app-side-menu></app-side-menu>
        </div>
        <div style="background-color: #0e141b; color: white;" class="col-10 d-flex flex-column p-3">
            <h1 class="text-white text-center">Editar meta</h1>
            <div class="form-container">
                <div class="campo">
                    <label>Descrição</label>
                    <input type="text" [(ngModel)]="meta.descricao">
                </div>
                <div class="campo">
                    <label>Período</label>
                    <div class="tipo-container">
                        <label class="radio-option">
                            <input type="radio" name="periodo" value="SEMANAL" [(ngModel)]="meta.periodo">
                            Semanal
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="periodo" value="MENSAL" [(ngModel)]="meta.periodo">
                            Mensal
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="periodo" value="ANUAL" [(ngModel)]="meta.periodo">
                            Anual
                        </label>
                    </div>
                    <div class="campo">
                        <label>Status</label>
                        <div class="tipo-container">
                            <label class="radio-option">
                                <input type="radio" name="status" value="EM_ANDAMENTO" [(ngModel)]="meta.status">
                                Em Andamento
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="status" value="CUMPRIDA" [(ngModel)]="meta.status">
                                Cumprida
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="status" value="PARCIAL" [(ngModel)]="meta.status">
                                Parcial
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="status" value="NAO_CUMPRIDA" [(ngModel)]="meta.status">
                                Não Cumprida
                            </label>
                        </div>
                    </div>
                    <div class="botoes">
                        <button class="btn-salvar" (click)="salvar()">Salvar</button>
                        <button class="btn-cancelar" (click)="to('/metas')">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
