<div class="flex-column d-flex vh-100 p-3">
    <div class="d-flex align-items-center mb-4">
        <img src="/images/CalendarioLogo.png" alt="Logo" width="70" height="70">
        <h2 class="text-white ms-3 mb-0">
            Planner Virtual
        </h2>
    </div>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/CalendarioDia.png" width="18" height="18">
        <span>Resumo do dia</span>
    </button>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/CalendarioMes.png" width="18">
        Calendário Mensal
    </button>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/CalendarioSemana.png" width="18">
        Calendário Semanal
    </button>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/Tarefas.png" width="18">
        Tarefas
    </button>
    <button (click)="goTo('metas')" class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/Metas.png" width="18">
        Metas
    </button>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/Lembretes.png" width="18">
        Lembretes
    </button>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/Categorias.png" width="18">
        Categorias
    </button>
    <button class="btn btn-dark d-flex justify-content-start align-items-center gap-3">
        <img src="/images/Relatórios.png" width="18">
        Relatórios
    </button>
    <div class="mt-auto d-grid gap-2">
        <button class="btn btn-outline-light justify-content-start align-items-center d-flex">
            <div
                class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold p-2"
                style="width:40px; height:40px;">{{inicial}}</div>
                <div class="p-2">{{nome}}</div>
        </button>
        <button class="btn btn-outline-light " (click)="click()">
            Sair
        </button>
    </div>
</div>
