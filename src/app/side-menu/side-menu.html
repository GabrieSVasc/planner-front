<aside class="side-menu">
    <div class="brand-block">
        <img src="/images/CalendarioLogo.png" alt="Logo" width="64" height="64">
        <div>
            <p class="brand-kicker">Planner</p>
            <h2 class="brand-title">Virtual</h2>
        </div>
    </div>

    <nav class="menu-list">
        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/CalendarioDia.png" width="18" height="18" alt="">
            <span>Resumo do dia</span>
        </button>

        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/CalendarioMes.png" width="18" height="18" alt="">
            <span>Calendario mensal</span>
        </button>

        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/CalendarioSemana.png" width="18" height="18" alt="">
            <span>Calendario semanal</span>
        </button>

        <a
            routerLink="/tarefas"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="menu-item"
        >
            <img src="/images/Tarefas.png" width="18" height="18" alt="">
            <span>Tarefas</span>
        </a>

        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/Metas.png" width="18" height="18" alt="">
            <span>Metas</span>
        </button>

        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/Lembretes.png" width="18" height="18" alt="">
            <span>Lembretes</span>
        </button>

        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/Categorias.png" width="18" height="18" alt="">
            <span>Categorias</span>
        </button>

        <button type="button" class="menu-item is-muted" disabled>
            <img src="/images/Relatórios.png" width="18" height="18" alt="">
            <span>Relatorios</span>
        </button>
    </nav>

    <button class="logout-button" type="button" (click)="sair.emit()">
        Sair
    </button>
</aside>
