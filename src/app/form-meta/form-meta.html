<div class="container-fluid vh-100 d-flex flex-column">
    <div class="row flex-grow-1">
        <div class="col-2 bg-dark">
            <app-side-menu></app-side-menu>
        </div>
        <div style="background-color: #0e141b;" class="col-10 d-flex flex-column p-3">
            <h1 class="text-white text-center">{{text}} meta</h1>
            <div class="row flex-grow-1">
                <div class="d-flex justify-content-center align-items-center">
                    <div class="p-4 border border-light rounded w-50 bg-dark">
                        <form #metaForm="ngForm" (ngSubmit)="salvar()">
                            <input type="hidden" value="{{meta.id}}">
                            <div class="mb-3">
                                <label class="form-label text-white">Descrição</label>
                                <input class="form-control" name="descricao" [(ngModel)]="meta.descricao" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Período</label>
                                <select class="form-select form-select-lg mb-3" aria-label="Large select example" name="periodo" [(ngModel)]="meta.periodo" required>
                                    <option [ngValue]="'SEMANAL'">Semanal</option>
                                    <option [ngValue]="'MENSAL'">Mensal</option>
                                    <option [ngValue]="'ANUAL'">Anual</option>
                                </select>
                            </div>
                            <div class="d-grid gap-2">
                                <button [disabled]="metaForm.invalid" type="submit" class="btn btn-outline-light">{{text}}</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
