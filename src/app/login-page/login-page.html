<div style="background-color: #0e141b;" class="flex-grow-1 container-fluid vh-100 d-flex flex-column">
    <div class="row">
        <div class="col d-flex flex-column vh-100 p-3 align-items-center justify-content-center">
            <img src="/images/CalendarioLogo.png" width="170" height="170">
            <h1 class="text-white ms-3 mb-0" style="font-size: 70pt;">Planner Virtual</h1>
        </div>
        <div class="text-white col d-flex flex-column align-items-center justify-content-center">
            <div style="width: 60%;background-color: #161c24; border: 1px solid #fff" class="rounded">
                <div style=" width: 90%;" class="container p-3">
                    @if (errorMessage) {
                        <div class="alert alert-danger py-2" role="alert">
                            {{ errorMessage }}
                        </div>
                    }
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email: </label>
                            <input type="email" class="form-control" id="email" formControlName="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha: </label>
                            <input type="password" class="form-control" id="password" formControlName="password">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-outline-light" [disabled]="isSubmitting">
                                {{ isSubmitting ? 'Entrando...' : 'Login' }}
                            </button>
                        </div>
                    </form>
                    <br>
                    <div class="d-flex justify-content-between">
                        <a href="#">Esqueci minha senha</a>
                        <a routerLink="/cadastro">Registrar-se</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
