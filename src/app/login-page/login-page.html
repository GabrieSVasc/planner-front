<div style=" width: 90%;" class="container p-3">
    <form [formGroup]="loginForm" (ngSubmit)="submit()">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome de Usuário: </label>
            <input type="text" class="form-control" id="nome" formControlName="nome" required>
            @if (campoInvalido('nome')) {
                <div class="text-danger">
                    O campo do nome deve estar preenchido
                </div>
            }
        </div>
        <div class="text-white col d-flex flex-column align-items-center justify-content-center">
            <div style="width: 60%;background-color: #161c24; border: 1px solid #fff" class="rounded">
                <div style=" width: 90%;" class="container p-3">
                    @if (errorMessage) {
                        <div class="alert alert-danger py-2" role="alert">
                            {{ errorMessage }}
                        </div>
                    }
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email: </label>
                            <input type="email" class="form-control" id="email" formControlName="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha: </label>
                            <input type="password" class="form-control" id="password" formControlName="password">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-outline-light" [disabled]="isSubmitting">
                                {{ isSubmitting ? 'Entrando...' : 'Login' }}
                            </button>
                        </div>
                    </form>
                    <br>
                    <div class="d-flex justify-content-between">
                        <a href="#">Esqueci minha senha</a>
                        <a routerLink="/cadastro">Registrar-se</a>
                    </div>
                </div>
            }
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-outline-light">Login</button>
        </div>
    </form>
    <br>
    <div class="text-center">
    <a>Ainda não possui uma conta? </a>
    <a href="/cadastro">Registrar-se</a>
    </div>
</div>
